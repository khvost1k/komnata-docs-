# Правило замены терминов: «используйте X вместо Y».
# Слева — нежелательное слово (регулярное выражение), справа — рекомендуемое.
# [а-яё]* в конце ловит любые окончания: юзер, юзера, юзеры...
extends: substitution
message: "Используйте «%s» вместо «%s»."
level: error                    # error блокирует слияние, warning только сообщает
ignorecase: true
swap:
  юзер[а-яё]*: пользователь
